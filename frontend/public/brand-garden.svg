<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" role="img" aria-labelledby="title desc">
  <title id="title">A thriving home garden</title>
  <desc id="desc">Tall leafy plants, climbing vines, and ripening tomatoes against a warm garden wall.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0d6a8"/>
      <stop offset=".55" stop-color="#dfb987"/>
      <stop offset="1" stop-color="#b8865d"/>
    </linearGradient>
    <radialGradient id="light" cx=".72" cy=".16" r=".72">
      <stop offset="0" stop-color="#fff6ce" stop-opacity=".9"/>
      <stop offset="1" stop-color="#fff6ce" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leafA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9cf7d"/>
      <stop offset=".55" stop-color="#5f8d4f"/>
      <stop offset="1" stop-color="#2e5836"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3ea9c"/>
      <stop offset=".5" stop-color="#7fa95f"/>
      <stop offset="1" stop-color="#3d6a3f"/>
    </linearGradient>
    <linearGradient id="pot" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d98b5d"/>
      <stop offset=".6" stop-color="#b96a43"/>
      <stop offset="1" stop-color="#8d4a30"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope=".13"/></feComponentTransfer>
      <feBlend in="SourceGraphic" mode="soft-light"/>
    </filter>
    <filter id="blur"><feGaussianBlur stdDeviation="22"/></filter>
  </defs>

  <rect width="1000" height="1400" fill="url(#wall)"/>
  <rect width="1000" height="1400" fill="url(#light)"/>

  <g opacity=".13" fill="none" stroke="#6d4b30" stroke-width="3">
    <path d="M0 240h1000M0 470h1000M0 700h1000M0 930h1000"/>
    <path d="M180 0v1400M440 0v1400M700 0v1400M920 0v1400"/>
  </g>

  <circle cx="760" cy="250" r="150" fill="#fff0b8" opacity=".5" filter="url(#blur)"/>

  <g stroke="#4b6b39" stroke-width="7" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M120 1400C150 1080 230 800 360 560"/>
    <path d="M430 1400C450 1120 540 880 700 690"/>
    <path d="M780 1400C800 1160 860 980 940 830"/>
  </g>

  <g fill="url(#leafA)">
    <g transform="translate(240 780) rotate(-32)">
      <path d="M0 0C80-150 250-200 420-110 330 60 150 120 0 0Z"/>
      <path d="M12-8C150-32 280-52 410-108" stroke="#d5e8aa" stroke-width="5" fill="none" opacity=".45"/>
    </g>
    <g transform="translate(470 620) rotate(22)">
      <path d="M0 0C70-140 230-190 390-100 300 70 130 120 0 0Z"/>
      <path d="M10-6C140-28 260-48 380-96" stroke="#d5e8aa" stroke-width="5" fill="none" opacity=".4"/>
    </g>
    <g transform="translate(690 900) rotate(-16)">
      <path d="M0 0C64-128 210-174 356-92 274 64 118 110 0 0Z"/>
    </g>
  </g>

  <g fill="url(#leafB)">
    <g transform="translate(120 460) rotate(18)">
      <path d="M0 0C58-116 190-158 322-84 248 58 106 100 0 0Z"/>
    </g>
    <g transform="translate(560 1050) rotate(-28)">
      <path d="M0 0C66-132 216-180 366-96 282 66 122 114 0 0Z"/>
    </g>
    <g transform="translate(760 430) rotate(34)">
      <path d="M0 0C50-100 164-136 278-72 214 50 92 86 0 0Z"/>
    </g>
  </g>

  <g fill="#4a7a3f">
    <g transform="translate(300 940)">
      <rect x="-6" y="0" width="12" height="230" rx="6"/>
      <g fill="#7fae63">
        <ellipse cx="-52" cy="58" rx="62" ry="24" transform="rotate(-24 -52 58)"/>
        <ellipse cx="52" cy="96" rx="62" ry="24" transform="rotate(24 52 96)"/>
        <ellipse cx="-46" cy="148" rx="54" ry="21" transform="rotate(-20 -46 148)"/>
        <ellipse cx="48" cy="186" rx="54" ry="21" transform="rotate(20 48 186)"/>
      </g>
    </g>
  </g>

  <g>
    <path d="M700 1400l32-260h190l34 260Z" fill="url(#pot)"/>
    <rect x="706" y="1120" width="216" height="46" rx="14" fill="#cf8154"/>
    <g stroke="#476b39" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M792 1124c-4-110 12-210 44-300"/>
      <path d="M850 1124c10-120 46-210 96-282"/>
    </g>
    <g fill="#84b263">
      <ellipse cx="786" cy="970" rx="54" ry="21" transform="rotate(-28 786 970)"/>
      <ellipse cx="842" cy="1010" rx="52" ry="20" transform="rotate(26 842 1010)"/>
      <ellipse cx="900" cy="930" rx="50" ry="19" transform="rotate(-22 900 930)"/>
      <ellipse cx="936" cy="1000" rx="46" ry="18" transform="rotate(24 936 1000)"/>
    </g>
    <g fill="#c9553d">
      <circle cx="812" cy="1018" r="27"/>
      <circle cx="884" cy="1058" r="23"/>
      <circle cx="852" cy="944" r="20"/>
    </g>
    <g fill="#d9eab4" opacity=".6">
      <circle cx="804" cy="1008" r="5"/>
      <circle cx="878" cy="1050" r="4"/>
    </g>
  </g>

  <g fill="#f6df9d">
    <circle cx="168" cy="760" r="12"/>
    <circle cx="198" cy="800" r="7"/>
    <circle cx="610" cy="500" r="10"/>
    <circle cx="650" cy="530" r="6"/>
  </g>

  <path d="M0 1260c180-70 380-84 560-36 150 40 290 42 440 6v170H0Z" fill="#3b5a35" opacity=".5"/>

  <rect width="1000" height="1400" filter="url(#grain)" opacity=".55"/>
  <rect width="1000" height="1400" fill="#2b1c10" opacity=".06"/>
</svg>
