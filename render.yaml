services:
  - type: web
    name: crop-disease-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: crop-disease-ai-db
          property: connectionString
      - key: FLASK_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: WEATHER_API_URL
        value: https://api.openweathermap.org/data/2.5/forecast
      - key: WEATHER_API_KEY
        sync: false
      - key: DATA_GOV_IN_API_KEY
        sync: false
      - key: DATA_GOV_IN_MANDI_RESOURCE_ID
        value: 9ef84268-d588-465a-a308-a864a43d0070
      - key: DATA_GOV_IN_BASE_URL
        value: https://api.data.gov.in/resource

databases:
  - name: crop-disease-ai-db
    plan: free
    databaseName: crop_ai
    user: crop_ai
