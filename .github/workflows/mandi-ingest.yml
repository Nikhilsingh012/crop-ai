name: Daily mandi price ingest

# Render's servers cannot reach api.data.gov.in (blocked), so the official
# AGMARKNET price feed is imported from GitHub Actions instead and written
# directly into the Render PostgreSQL database.

on:
  schedule:
    - cron: "30 2 * * *" # 08:00 IST daily
  workflow_dispatch: # manual run from the Actions tab

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install "psycopg[binary]>=3.2,<4.0"

      - name: Import fresh mandi prices
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.RENDER_DATABASE_URL }}
          DATA_GOV_IN_API_KEY: ${{ secrets.DATA_GOV_IN_API_KEY }}
        run: python -m services.market_ingest
